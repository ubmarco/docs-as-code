[lint]
# `needs.dead_link`/`needs.link_ref` used to be ignored here (~130 hits) because
# the ~100 tool_req__* needs' `:satisfies:`/`:need:` references into the separate
# eclipse-score "process_description" repo (gd_req__*/gd_guidl__*/...) were
# unresolved -- no [needs.external_needs] source was configured for it. Now that
# docs/_ubtn_external/process_needs.json is wired in as
# `[[needs.external_needs]]` (see above), those references resolve and both
# codes no longer fire -- verified with `ubc check docs --output-format json -c
# 'lint.ignore = []'` (0 hits, down from 127 + 4).
#
# What's genuinely still needed: process_description's own needs.json links
# some of *its* needs to each other with sphinx-needs' version-conditioned link
# syntax (e.g. `wf__cr_mt_comparch[version==1]` in a `satisfies`/`realizes`/...
# field) -- a versioning feature ubc's schema does not model (no `version`
# field is declared anywhere in this project's [needs.fields.*], nor does ubc
# special-case it for external sources). That is entirely process_description's
# own internal linkage, not this repo's content, and not something we can fix
# from here -- it fires `needs.external` once (declaring the dropped `version`
# key) and `needs.link_condition_invalid` ~1290 times (one per version-
# conditioned link between two external needs). See tools/ubtn/README.md
# "Known gaps".
ignore = ["needs.link_condition_invalid", "needs.external"]

[scripts]
ubtrace-prepare = "bash ../tools/ubtn/ubtrace-prepare.sh"
