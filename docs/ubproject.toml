"$schema" = "https://ubcode.useblocks.com/ubproject.schema.json"

# Parser routing: this project mixes reStructuredText and MyST Markdown
# (docs/how-to/*.md, docs/internals/**/*.md). Both parsers must be declared
# explicitly -- declaring only [parse.parsers.md] would switch ubCode into
# parser mode and drop *.rst discovery.
[parse.parsers.rst]

[parse.parsers.md]
flavour = "myst"

# score_sphinx_bundle enables the myst "colon_fence" extension globally
# (docs/conf.py -> score_sphinx_bundle -> myst_enable_extensions), and the
# .md files under docs/ use ```{directive}``` fences plus plain Markdown --
# no colon-fence content was found in this docs/ tree, but the setting is
# kept so a future ":::{...}" block is not silently misparsed.
[parse.parsers.md.extensions]
colon_fence = true

[project]
name = "Score Docs-as-Code"

[build.html]
# ubtrace-native's builder runs a plain `ubc build html docs`, with no
# `--deny` flag, so the config-file default is what actually gates the
# hosted build. The default `deny = "warning"` would fail it: this content
# carries ~70 pre-existing warnings (tab characters in code blocks, a couple
# of bare blockquotes, needpie/needtable filter syntax ubc's portable filter
# engine does not run, and one need-type/built-in directive name collision)
# that are real but not build-breaking -- see tools/ubtn/README.md
# "Known gaps". `error` still fails the build on genuine errors; it does not
# mean "ignore everything" the way `none` would.
deny = "error"

[needs]
id_required = true
# The repo's own sphinx-needs setup allows lowercase, digits, underscores and
# hyphens in need IDs (see needs_id_regex in
# src/extensions/score_metamodel/__init__.py); ubc's own default id_regex
# requires uppercase-only IDs, which every need type's lowercase prefix
# (tsf__, wf__, tool_req__, ...) would fail.
id_regex = "^[A-Za-z0-9_-]{6,}$"

# docs/internals/requirements/process_overview.rst and requirements.rst carry
# needtable views filtered on process-need types (gd_req, ...) that were
# effectively empty before external needs were wired in below. With them
# wired, one such view now matches all 177 gd_req__* needs and hits ubc's
# default view cap (100), truncating with `build.need_view_truncated` --
# uncapped so those tables render completely, matching what they were
# authored to show.
views_max_items = 0

# External needs: S-CORE's process description (gd_req__*/gd_guidl__*/std_req__*/
# std_wp__*/workflow__*/workproduct__*/...) is defined in the separate
# eclipse-score/process_description repo, not in this fork. Upstream feeds it into
# sphinx-needs via Bazel: BUILD's `docs(external_needs =
# ["@score_process_description//:needs_json_file"])`, backed by MODULE.bazel's
# `bazel_dep(name = "score_process_description", version = "2.1.2")`. Upstream never
# mounts process_description's *pages* here (its `bundles` list has no
# process_description entry, unlike e.g. the metamodel/extensions bundles below) --
# only the needs.json is consumed, and links resolve to the externally-hosted site via
# base_url. src/extensions/score_metamodel/external_needs.py builds that base_url as
# `needs_json_data["project_url"] + "/main"`; since project_url itself already ends in
# "/" (verified against the built needs.json), that literally produces
# ".../process_description//main" with a doubled slash in the upstream-generated
# ubproject.toml -- corrected to a single slash here since we hand-author this entry
# rather than replaying the generator's string concatenation.
#
# ubtrace-prepare.sh materializes that JSON into docs/_ubtn_external/process_needs.json
# after `bazel run //:docs_check` (bazel-bin/bazel-out are symlinks OUT of this
# worktree -- see the script's comments -- so the file is copied in, not referenced via
# a path that only resolves in this container, to survive ubtrace-native's
# snapshot/restore round trip). No id_prefix: process_description's own IDs already
# carry their type prefixes, and this fork defines no local needs of the same types
# (verified: no `.. gd_req::`/`.. std_req::`/... directives exist under docs/), so there
# is no collision to disambiguate.
[[needs.external_needs]]
json_path = "_ubtn_external/process_needs.json"
base_url = "https://eclipse-score.github.io/process_description/main"

